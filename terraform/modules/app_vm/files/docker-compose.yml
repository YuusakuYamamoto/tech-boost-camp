# Terraform の templatefile で展開してから Object Storage に置く（main.tf）。
# このファイルはコメントも含めてテンプレートとして解釈される。
#   - registry_domain / namespace / image_tag は Terraform が展開する
#   - DB_* はドル記号を 2 つ重ねてエスケープしてあり、Terraform を通った後に
#     Docker Compose が .env から展開する
# .env は bootstrap-app.sh が Vault から取得した値で書き出す。
services:
  frontend:
    image: ${registry_domain}/${namespace}/tbcamp-frontend:${image_tag}
    container_name: tbcamp-frontend
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tokyo
    ports:
      - "3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${registry_domain}/${namespace}/tbcamp-backend:${image_tag}
    container_name: tbcamp-backend
    restart: always
    env_file:
      - .env
    environment:
      TZ: Asia/Tokyo
      DATABASE_URL: postgresql://$${DB_USER}:$${DB_PASSWORD}@$${DB_HOST}:$${DB_PORT}/$${DB_NAME}?schema=public
    ports:
      - "4000:4000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
