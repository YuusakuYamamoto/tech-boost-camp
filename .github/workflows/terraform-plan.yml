name: Terraform Plan

on:
  pull_request:
    branches:
      - main
      - 'deployment/infra/**'
    # paths フィルタなし: PR のたびに必ず起動させ、detect-changes job で差分を判定する
    # 理由: paths フィルタで起動しない PR は Ruleset の Required status check が
    #       "Expected" のまま残り、マージがブロックされる問題があった
    # 対処: status-gate job（name: "Terraform Plan"）が常に結果を返すことでブロックを解消
    #
    # TODO: test自動化の追加などワークフローが複数になったタイミングで
    #   terraform-plan.yml を Reusable Workflow（workflow_call）に切り出し、
    #   orchestrator ワークフローから呼び出す構成に移行する

permissions:
  contents: read
  pull-requests: write
  id-token: write  # GitHub OIDC JWT の取得に必要

jobs:
  # Job 1: terraform 関連ファイルの変更有無を検出する
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      terraform: ${{ steps.filter.outputs.terraform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # 全履歴を取得して git diff を正確に実行するため

      - name: Check for terraform changes
        id: filter
        run: |
          CHANGED=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" \
            | grep -E '^(terraform/.*\.(tf|tfvars)|terraform/\.terraform\.lock\.hcl|\.github/workflows/terraform-.*\.yml)' \
            || true)
          if [ -n "$CHANGED" ]; then
            echo "terraform=true" >> "$GITHUB_OUTPUT"
            echo "Terraform-related changes detected:"
            echo "$CHANGED"
          else
            echo "terraform=false" >> "$GITHUB_OUTPUT"
            echo "No terraform-related changes — plan will be skipped"
          fi

  # Job 2: terraform plan を実行する（terraform 関連の変更がある場合のみ）
  plan:
    name: Terraform Plan (run)
    needs: detect-changes
    if: needs.detect-changes.outputs.terraform == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # Terraform に渡す変数(TF_VAR_<name> は variable "<name>" に対応)
      TF_VAR_region: ${{ vars.OCI_REGION }}
      TF_VAR_tenancy_id: ${{ vars.OCI_TENANCY_OCID }}
      TF_VAR_compartment_id: ${{ vars.OCI_COMPARTMENT_OCID }}
      TF_VAR_auth: SecurityToken
      TF_VAR_ssh_public_key: ${{ vars.TF_VAR_SSH_PUBLIC_KEY }}
      # OCI への認証は OIDC トークン交換で取得した UPST 経由

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        # terraform_version を指定しないことで .terraform-version を自動参照

      - name: Exchange GitHub OIDC token for OCI UPST
        run: |
          set -euo pipefail

          # 1. 一時 RSA 鍵ペアを生成（UPST の Proof-of-Possession 用）
          mkdir -p "$HOME/.oci"
          PRIVATE_KEY_FILE="$HOME/.oci/session-key.pem"
          PUBLIC_KEY_FILE="$HOME/.oci/session-key-public.pem"
          openssl genrsa -out "$PRIVATE_KEY_FILE" 2048 2>/dev/null
          openssl rsa -pubout -in "$PRIVATE_KEY_FILE" -out "$PUBLIC_KEY_FILE" 2>/dev/null
          chmod 600 "$PRIVATE_KEY_FILE"

          # 公開鍵から PEM ヘッダー/フッターを除去し、base64 本体のみ取得
          PUBLIC_KEY=$(grep -v "^-----" "$PUBLIC_KEY_FILE" | tr -d '\n')

          # 2. GitHub OIDC JWT を取得
          GITHUB_JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=${{ vars.OCI_DOMAIN_URL }}" | jq -r '.value')

          if [ -z "$GITHUB_JWT" ] || [ "$GITHUB_JWT" = "null" ]; then
            echo "::error::Failed to obtain GitHub OIDC token"
            exit 1
          fi
          echo "GitHub OIDC token obtained successfully"

          # 3. OCI Token Exchange: GitHub JWT → UPST
          CLIENT_CREDENTIALS=$(echo -n "${{ vars.OCI_CLIENT_ID }}:${{ secrets.OCI_CLIENT_SECRET }}" | base64 -w 0)

          RESPONSE=$(curl -s -X POST \
            "${{ vars.OCI_DOMAIN_URL }}/oauth2/v1/token" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -H "Authorization: Basic ${CLIENT_CREDENTIALS}" \
            --data-urlencode "grant_type=urn:ietf:params:oauth:grant-type:token-exchange" \
            --data-urlencode "requested_token_type=urn:oci:token-type:oci-upst" \
            --data-urlencode "subject_token=${GITHUB_JWT}" \
            --data-urlencode "subject_token_type=jwt" \
            --data-urlencode "public_key=${PUBLIC_KEY}")

          UPST=$(echo "$RESPONSE" | jq -r '.token // .access_token')
          TOKEN_TYPE=$(echo "$RESPONSE" | jq -r '.token_type // "UPST"')

          if [ -z "$UPST" ] || [ "$UPST" = "null" ]; then
            ERROR_DESC=$(echo "$RESPONSE" | jq -r '.error_description // .error // "Unknown error"')
            echo "::error::Token exchange failed: ${ERROR_DESC}"
            exit 1
          fi
          echo "OCI UPST obtained successfully (token_type: ${TOKEN_TYPE})"

          # 4. UPST をファイルに保存
          UPST_FILE="$HOME/.oci/upst-token"
          printf '%s' "$UPST" > "$UPST_FILE"
          chmod 600 "$UPST_FILE"

          # 5. ~/.oci/config をセッショントークン認証モードで生成
          FINGERPRINT=$(openssl rsa -pubout -outform DER -in "$PRIVATE_KEY_FILE" 2>/dev/null | openssl md5 -c | awk '{print $2}')
          {
            echo "[TBCAMP_TERRAFORM]"
            echo "tenancy=${{ vars.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
            echo "auth=SecurityToken"
            echo "security_token_file=${UPST_FILE}"
            echo "key_file=${PRIVATE_KEY_FILE}"
            echo "fingerprint=${FINGERPRINT}"
          } > "$HOME/.oci/config"
          chmod 600 "$HOME/.oci/config"

          echo "OCI config written with SecurityToken auth"

      - name: Terraform fmt
        run: terraform fmt -check -recursive
        working-directory: .

        # backend.tf で namespace を partial configuration にしているため「required 属性がない」と誤判定してエラー
        # terraform init -backend=false で backend 初期化をスキップした状態で init すると、
        # backend の required 属性チェックが行われないため validate が通る
      - name: Terraform init (validate only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93  # v6.2.2
        with:
          tflint_version: v0.62.0

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: TFLint run
        run: tflint --recursive

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: 1
          severity: HIGH,CRITICAL
          trivyignores: ${{ github.workspace }}/.trivyignore

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="namespace=${{ vars.OCI_NAMESPACE }}" \
            -backend-config="config_file_profile=TBCAMP_TERRAFORM" \
            -lockfile=readonly

      - name: Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -no-color -input=false -out=tfplan 2>&1 | tee plan_output.txt
          {
            echo 'PLAN_OUTPUT<<EOF'
            cat plan_output.txt
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Comment PR with plan
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const planOutput = process.env.PLAN_OUTPUT || '(no plan output captured)';
            const maxLength = 60000;
            const body = planOutput.length > maxLength
              ? planOutput.slice(0, maxLength) + `\n\n... (truncated, ${planOutput.length - maxLength} chars omitted)`
              : planOutput;

            const outcome = '${{ steps.plan.outcome }}';
            const icon = outcome === 'success' ? '✅' : '❌';
            const header = `## ${icon} Terraform Plan: \`${outcome}\``;

            const commentBody = [
              header,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```hcl',
              body,
              '```',
              '',
              '</details>',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });

  # Job 3: Ruleset の Required status check が参照する gate job
  # name を "Terraform Plan" にすることで Ruleset 側の変更が不要になる
  # plan が skipped（terraform 変更なし）でも success を返し、マージをブロックしない
  # plan が failure のときのみ failure を返し、マージをブロックする
  status-gate:
    name: Terraform Plan
    needs: [detect-changes, plan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          DETECT="${{ needs.detect-changes.result }}"
          PLAN="${{ needs.plan.result }}"

          echo "detect-changes: $DETECT"
          echo "plan:           $PLAN"

          if [[ "$DETECT" == "failure" || "$DETECT" == "cancelled" ]]; then
            echo "::error::detect-changes job failed"
            exit 1
          fi
          if [[ "$PLAN" == "failure" || "$PLAN" == "cancelled" ]]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi

          # success または skipped（terraform 変更なし）はどちらも通過
          echo "Gate passed (plan: $PLAN)"
